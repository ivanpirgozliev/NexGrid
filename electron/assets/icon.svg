<svg width="400" height="400" viewBox="0 0 400 400" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>NexGrid app icon</title>
  <desc>A dark rounded square icon with a cyan N letterform made of Tetris-style grid blocks</desc>

  <defs>
    <clipPath id="iconClip">
      <rect x="0" y="0" width="400" height="400" rx="72"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="400" height="400" rx="72" fill="#0d1117"/>

  <!-- subtle grid background -->
  <g clip-path="url(#iconClip)" opacity="0.07" stroke="#00e5ff" stroke-width="0.7" fill="none">
    <line x1="0" y1="40" x2="400" y2="40"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="280" x2="400" y2="280"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="0" y1="360" x2="400" y2="360"/>
    <line x1="40" y1="0" x2="40" y2="400"/>
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="120" y1="0" x2="120" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="280" y1="0" x2="280" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/>
  </g>

  <!-- N letter — left column -->
  <rect x="45" y="65" width="54" height="54" rx="6" fill="#00e5ff" opacity="0.95"/>
  <rect x="45" y="125" width="54" height="54" rx="6" fill="#00e5ff" opacity="0.95"/>
  <rect x="45" y="185" width="54" height="54" rx="6" fill="#00e5ff" opacity="0.95"/>
  <rect x="45" y="245" width="54" height="54" rx="6" fill="#00e5ff" opacity="0.95"/>
  <rect x="45" y="305" width="54" height="54" rx="6" fill="#00e5ff" opacity="0.95"/>

  <!-- N diagonal -->
  <rect x="105" y="125" width="54" height="54" rx="6" fill="#00c4d9" opacity="0.90"/>
  <rect x="165" y="185" width="54" height="54" rx="6" fill="#00c4d9" opacity="0.90"/>
  <rect x="225" y="245" width="54" height="54" rx="6" fill="#00c4d9" opacity="0.90"/>

  <!-- N letter — right column -->
  <rect x="285" y="65" width="54" height="54" rx="6" fill="#00e5ff" opacity="0.95"/>
  <rect x="285" y="125" width="54" height="54" rx="6" fill="#00e5ff" opacity="0.95"/>
  <rect x="285" y="185" width="54" height="54" rx="6" fill="#00e5ff" opacity="0.95"/>
  <rect x="285" y="245" width="54" height="54" rx="6" fill="#00e5ff" opacity="0.95"/>
  <rect x="285" y="305" width="54" height="54" rx="6" fill="#00e5ff" opacity="0.95"/>

  <!-- glow border -->
  <rect x="0" y="0" width="400" height="400" rx="72" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.35"/>
</svg>
